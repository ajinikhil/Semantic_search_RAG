name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install black flake8 isort
      - run: black --check app/ tests/
      - run: flake8 --max-line-length=88 app/ tests/
      - run: isort --check-only app/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --cov=app --cov-fail-under=80

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install pip-audit
        # No fixed releases exist yet for either CVE — when patches ship,
        # bump the package instead of keeping the ignore:
        # - CVE-2026-45829 ("ChromaToast", chromadb): pre-auth RCE in the
        #   Chroma HTTP server. We only use the embedded PersistentClient,
        #   so the vulnerable server is never exposed.
        # - CVE-2025-3000 (torch, via sentence-transformers): local-only
        #   torch.jit.script segfault; we never script untrusted code.
      - run: pip-audit -r requirements.txt --ignore-vuln CVE-2026-45829 --ignore-vuln CVE-2025-3000

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -c "from app.main import app; print('Build OK')"
