name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install black flake8 isort
      - run: black --check app/ tests/
      - run: flake8 --max-line-length=88 app/ tests/
      - run: isort --check-only app/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --cov=app --cov-fail-under=80

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install pip-audit
        # CVE-2026-45829 ("ChromaToast"): affects chromadb 1.0.0-1.5.8.
        # 1.5.9 (pinned) is the patched release; the advisory DB has not yet
        # marked it as fixed. Remove this ignore once the DB is updated.
      - run: pip-audit -r requirements.txt --ignore-vuln CVE-2026-45829 # There are no updates currently
      - run: pip-audit -r requirements.txt --ignore-vuln CVE-2025-3000 # There are no updates currently

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -c "from app.main import app; print('Build OK')"
