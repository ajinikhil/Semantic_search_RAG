name: Publish Docker image

# Build the container image and push it to the GitHub Container Registry
# (ghcr.io), where it shows up under the repo's "Packages" tab. The built-in
# GITHUB_TOKEN authenticates to ghcr.io, so no extra secrets are needed.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]   # e.g. v1.0.0 -> also tags the image 1.0.0 and 1.0
  workflow_dispatch:    # allow manual runs from the Actions tab

env:
  REGISTRY: ghcr.io
  # metadata-action lowercases this, so the mixed-case repo name is fine.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required for GITHUB_TOKEN to push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # QEMU lets the amd64 runner also build the arm64 image via emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Multi-arch: amd64 for typical cloud/Intel hosts, arm64 so it runs
          # natively on Apple Silicon Macs (and ARM servers). Docker picks the
          # matching variant automatically on `docker pull`. The arm64 half is
          # built under QEMU emulation, so this run is slower than amd64 alone.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
